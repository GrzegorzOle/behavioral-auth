general:
  mode: prod                # prod | dev  (dev shrinks every gate — testing only)
  data_dir: "/var/lib/behavioral-auth"
  log_level: "INFO"
  log_file: "/var/lib/behavioral-auth/behavioral-auth.log"

daemon:
  tick_sec: 5
  run_dir: "/var/lib/behavioral-auth/run"
  console: "auto"           # auto (only on a TTY) | always | never

collector:
  devices: []               # empty = autodetect all keyboards and mice
  batch_size: 200
  flush_interval_sec: 1.0

storage:
  db_path: "/var/lib/behavioral-auth/behavior.duckdb"

features:
  window_sec: 20
  stride_sec: 5
  min_keyboard_events: 12
  min_mouse_events: 10
  scaler_path: "/var/lib/behavioral-auth/scaler.json"
  dedup_gap_sec: 2
  max_seq_gap_sec: 40       # discard sequences straddling an idle gap
  std_floor: 0.001          # never divide by a near-zero standard deviation

model:
  seq_len: 12               # sequence span = seq_len * stride_sec + window_sec = 80 s
  hidden_dim: 24
  num_layers: 3
  kernel_size: 3
  dropout: 0.10
  batch_size: 128
  epochs: 30
  lr: 0.001
  val_split: 0.2
  device: "cpu"             # cpu | cuda | auto
  model_path: "/var/lib/behavioral-auth/model.onnx"
  metadata_path: "/var/lib/behavioral-auth/model_meta.json"

learning:
  cycle_min_sec: 600            # retrain at most every 10 minutes
  cycle_min_new_sequences: 200  # ...and only with enough new material
  holdout_frac: 0.20            # newest 20 % held out, never trained on
  min_sequences: 1200
  min_active_minutes: 90        # summed window coverage, not wall-clock time
  min_distinct_hours: 3         # behaviour must be seen across the day
  stable_consecutive_cycles: 3
  stability:
    pass_rate_min: 0.90
    error_ratio_max: 1.6
    threshold_drift_max: 0.25
    false_alarm_max: 0.02
    sanity_detection_min: 0.90

alarm:
  enter_consecutive: 16
  enter_min_span_sec: 120
  clear_consecutive: 16
  clear_min_span_sec: 120
  clear_hysteresis: 0.20
  notify_cmd: "notify-send -u critical 'Behavioral Auth' 'Osoba przy klawiaturze nie odpowiada wzorcowi'"
  notify_cooldown_sec: 300
  heartbeat_sec: 300

face:
  enabled: true
  backend: "opencv"             # opencv | howdy
  camera_index: 0
  model_path: "/var/lib/behavioral-auth/face_model.yml"
  meta_path: "/var/lib/behavioral-auth/face_meta.json"
  samples_dir: "/var/lib/behavioral-auth/face_samples"
  confidence_threshold: "auto"  # auto = calibrate from held-out crops
  required_for_promotion: true
  min_samples: 60
  sample_interval_sec: 20
  retrain_every_n_samples: 30
  check_interval_sec: 30
  stranger_consecutive: 3
  stranger_stale_sec: 300       # stranger sightings stop counting once this old
  keep_samples: true
  min_face_width: 100
  min_sharpness: 60.0
  min_brightness: 40.0
  max_brightness: 220.0
  self_confidence_max: 90.0

# Forwarding to a SIEM. OFF unless you turn it on — while `enabled` is false no
# socket is opened anywhere in the tree, which is what lets this daemon claim it
# does not talk to the network.
#
# What is forwarded: alarms (raised and cleared), state transitions, and the
# operations that matter — reset, learn-more, pause, start, stop. A pattern reset
# is how someone makes this system forget who the owner is, so a SIEM hears about
# it. Per-sequence scores are NOT forwarded; at a 5 s stride they would be
# hundreds of events an hour.
#
# What never leaves the machine, whatever you set here: key codes, mouse
# coordinates, face crops, feature vectors. Events carry verdicts and ratios,
# not the behaviour they were computed from.
siem:
  enabled: false
  sink: "syslog"                # syslog | wazuh
  ident: "behavioral-auth"
  facility: 10                  # authpriv

  # sink: syslog — write to the local syslog socket. If a wazuh-agent is
  # installed it takes the line from there, so retries, buffering and TLS to the
  # manager are its job. Prefer this wherever an agent exists.
  socket_path: "/dev/log"

  # sink: wazuh — talk straight to the manager's syslog listener, for a box with
  # no agent. UDP sends are unacknowledged: they "succeed" whether or not anyone
  # is listening, so the spool cannot protect them. Use tcp if the trail matters.
  host: ""
  port: 514
  protocol: "tcp"               # udp | tcp

  # With forwarding on, alarms need not also be kept in DuckDB. Detection is
  # unaffected — the alarm lifecycle lives in memory — but `behavioral-report`
  # then has no local alarms to show you.
  #
  # Read this before trusting it to mean "no local copy". It removes ONE local
  # copy, not all of them:
  #   * with sink: syslog the event goes to /dev/log, so it also lands in
  #     journald/rsyslog on this machine and stays for as long as your system's
  #     log retention says. sink: wazuh bypasses the local syslog.
  #   * anything the SIEM has not acknowledged sits in the spool below until it
  #     does. A SIEM down for a day means a day of alarms in that file.
  # An event cannot both survive a broken link and leave no local trace. This
  # daemon chooses not to lose the event.
  store_alarms_locally: true

  # Undelivered events wait here and drain on a later tick, so a SIEM that is
  # down cannot stop the daemon from watching the keyboard. Delivered events are
  # removed. When the spool overflows, the oldest are dropped and the log says
  # so. Delivery is at-least-once: the SIEM must tolerate a duplicate.
  spool_path: "/var/lib/behavioral-auth/siem-spool.jsonl"
  spool_max_events: 10000
  flush_interval_sec: 10

# Checking whether a newer release exists. OFF unless you turn it on, and it only
# ever TELLS you: nothing is downloaded, no installer is started, no file is made
# executable. With check_enabled false the daemon makes no request at all — this
# and `siem` above are the only two things in the tree that can open a socket.
#
# Why it stops at telling you. This daemon reads every keystroke on the machine
# and starts automatically. A channel that could fetch new code and run it here
# is the single most valuable thing an attacker could subvert: one compromised
# release account and every installation becomes a keylogger, with nobody
# present. So the code to accept a binary is not disabled — it does not exist.
# Installing an upgrade stays a deliberate human act.
#
# `behavioral-auth check-update` asks regardless of this flag. The flag governs
# the daemon's unattended check; typing the command is itself the decision.
updates:
  check_enabled: false

  # Must be https: over plain http anyone on the path can answer "you are up to
  # date" and quietly suppress the notice. Repoint at an internal mirror if you
  # have one — anything answering with a JSON object carrying "tag_name" works.
  url: "https://api.github.com/repos/GrzegorzOle/behavioral-auth/releases/latest"

  interval_hours: 24    # a failed check also waits the full interval
  timeout_sec: 5.0

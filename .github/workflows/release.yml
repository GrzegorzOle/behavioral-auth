name: release

# Build the self-contained artifacts: the Linux AppImage and the Windows
# installer. Runs on a version tag (attaches both to the GitHub release) and on
# manual dispatch (artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # create a release and upload the AppImage to it

jobs:
  appimage:
    # Pin to the oldest supported runner on purpose: an AppImage links against
    # the build host's glibc, so building on an older one keeps it runnable on
    # more targets. Do not bump to ubuntu-latest without weighing that.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with behavioral_auth.__version__ ships a binary that
      # misreports itself, and the update notice compares exactly that string: an
      # installed 0.5.13 still claiming 0.5.12 would tell its user an upgrade is
      # available, forever. Checked before anything is built, so a forgotten
      # version bump costs seconds rather than two 420 MB builds.
      - name: The tag must agree with behavioral_auth.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          src=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" src/behavioral_auth/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=${tag}  __version__=${src}"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag ${tag} != __version__ ${src} — bump src/behavioral_auth/__init__.py"
            exit 1
          fi

      # appimagetool needs mksquashfs, and the type-2 runtime it embeds links
      # against FUSE 2; ubuntu-22.04 runners ship neither. Without these the
      # "Build AppImage" step fails even with APPIMAGE_EXTRACT_AND_RUN.
      - name: Install AppImage build deps
        run: sudo apt-get update && sudo apt-get install -y libfuse2 squashfs-tools zip

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Creates .venv with the CPU-only torch wheel (requirements.txt pins it),
      # all deps, pyinstaller (requirements-dev), and the editable install.
      - name: Build venv
        run: make venv

      - name: Lint and test
        run: |
          make lint
          make test

      - name: Fetch appimagetool
        run: |
          curl -sSL -o "${RUNNER_TEMP}/appimagetool.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "${RUNNER_TEMP}/appimagetool.AppImage"

      # build-appimage.sh already runs appimagetool with APPIMAGE_EXTRACT_AND_RUN,
      # so the runner needs no FUSE.
      - name: Build AppImage
        run: make appimage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool.AppImage

      # --help exits in argparse before any config/DB is touched, so this needs
      # no /var/lib state — yet it still exercises the whole frozen import graph
      # (torch, onnx, cv2, duckdb).
      - name: Smoke-test the AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/behavioral-auth-x86_64.AppImage authd --help
          test -x dist/behavioral-auth-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: behavioral-auth-x86_64.AppImage
          path: dist/behavioral-auth-x86_64.AppImage
          if-no-files-found: error

      # The Wazuh decoders and rules are manager-side configuration: they are
      # installed on the SIEM, not on the machine running the daemon, so they
      # cannot ride inside the AppImage or the installer. Without this they were
      # reachable only by cloning the repo, which is a poor ask of whoever
      # administers the manager. Built here rather than in the windows job so the
      # archive is produced exactly once, and it carries both transports' pairs
      # (0910-* syslog, 0911-* Event Log) plus the README that explains which is
      # which and how to verify them.
      - name: Package the Wazuh decoders and rules
        run: |
          zip -j dist/behavioral-auth-wazuh.zip packaging/wazuh/*.xml packaging/wazuh/README.md
          unzip -l dist/behavioral-auth-wazuh.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # The AppImage plus the bilingual usage guide (docs/USAGE.md), so the
          # release carries the how-to-install-and-run instructions alongside the
          # binaries. Attached from this job only — the windows job adds the
          # installer separately.
          files: |
            dist/behavioral-auth-x86_64.AppImage
            docs/USAGE.md
            dist/behavioral-auth-wazuh.zip

  # The Windows one-folder bundle wrapped into an Inno Setup installer. Mirrors
  # the AppImage job on a windows runner. Not verified against a real desktop
  # session — the smoke test only exercises the frozen import graph via --help.
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # No make on the Windows runner; install the same deps directly. The win32
      # markers in requirements.txt pull pynput + pywin32 here.
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # Version from the tag (v0.3.0 -> 0.3.0); a dispatch build has no tag.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # The same check the appimage job makes, repeated here because this job is
      # the one that stamps the version onto the installer's filename and its
      # Add/Remove Programs entry. Deps are installed above, so ask the package.
      - name: The tag must agree with behavioral_auth.__version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          src=$(python -c "import behavioral_auth; print(behavioral_auth.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=${tag}  __version__=${src}"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag ${tag} != __version__ ${src} — bump src/behavioral_auth/__init__.py"
            exit 1
          fi

      # Inno Setup provides iscc; the runner does not ship it.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build bundle + installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-windows.ps1 -Version ${{ steps.ver.outputs.version }}

      # --help exits in argparse before any config/DB is touched, yet still walks
      # the whole frozen import graph (torch, onnx, cv2, duckdb, pynput, pywin32).
      # Check the exit code explicitly — a native crash does not fail a pwsh step
      # on its own — and the installer independently.
      - name: Smoke-test the bundle
        run: |
          dist\behavioral-auth\behavioral-auth.exe --help
          if ($LASTEXITCODE -ne 0) { throw "behavioral-auth.exe --help exited $LASTEXITCODE" }
          $setup = "dist\behavioral-auth-setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "installer missing: $setup" }
          Write-Host "OK: bundle runs and installer present"

      # The SCM starts the service executable with NO arguments and waits for it
      # to connect back. Every command a human types (install/start/stop/debug)
      # carries arguments and takes a different path, so this is the one
      # invocation that never got tried by hand -- and for three releases it just
      # printed usage and exited, which the SCM could only report as 7000/7009
      # after a two-minute wait. From a console the dispatcher cannot connect and
      # fails with error 1063; that failure is the proof it is being called at
      # all. Match on the numeric code, since the message is localised.
      # Note the deliberate `exit 0`: the executable is *supposed* to fail here,
      # so it leaves $LASTEXITCODE at 1, and the pwsh step would otherwise inherit
      # that and fail the job after the checks had already passed. A `throw` above
      # still fails the step, so nothing is swallowed.
      - name: The service executable must talk to the SCM, not print usage
        run: |
          $out = & dist\behavioral-auth\behavioral-auth-service.exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($out -match 'Usage:') {
            throw "service exe printed usage with no arguments - the SCM would never see it connect"
          }
          if ($out -notmatch '1063') {
            throw "expected StartServiceCtrlDispatcher to fail with 1063 from a console; got: $out"
          }
          Write-Host "OK: the service executable calls StartServiceCtrlDispatcher (exit $code, as expected)"
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: behavioral-auth-setup
          path: dist/behavioral-auth-setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/behavioral-auth-setup-*.exe

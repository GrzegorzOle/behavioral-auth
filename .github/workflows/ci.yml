name: ci

# Lint and test on every push and pull request. The release workflow repeats
# these before building, so a tagged build never ships an untested tree — this
# just gives the same signal on ordinary pushes.
on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same ref cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Build venv
        run: make venv

      - name: Lint
        run: make lint

      - name: Test
        run: make test

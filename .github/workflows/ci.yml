name: ci

# Lint and test on every push and pull request. The release workflow repeats
# these before building, so a tagged build never ships an untested tree — this
# just gives the same signal on ordinary pushes.
on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same ref cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Build venv
        run: make venv

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # A Windows runner in the matrix, per Stage 2. It does not re-run the whole
  # suite (much of it assumes Linux paths / AF_UNIX); it installs the real
  # Windows deps (pynput + pywin32 via the win32 markers) and runs the
  # OS-agnostic parts the Windows port rests on — the VK->evdev map and the
  # event shaper — plus an import smoke of the Windows-only modules. That proves
  # those modules import and their logic holds on Windows, without dragging in
  # the Linux-assuming tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Import-smoke the Windows-only modules
        run: |
          python -c "import behavioral_auth.collector.windows_source; import behavioral_auth.siem.sinks; print('windows modules import OK')"
          python -m py_compile packaging/windows/service.py

      - name: Test the OS-agnostic port logic
        run: python -m pytest tests/test_keycodes.py tests/test_windows_source.py tests/test_training.py tests/test_mouse_features.py tests/test_updates.py tests/test_version.py tests/test_zones.py -q

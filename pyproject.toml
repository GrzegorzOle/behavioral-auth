[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-auth"
version = "0.3.0"
description = "Local-only behavioral authentication for Linux"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"behavioral_auth.db" = ["migrations/*.sql"]

[project.scripts]
behavioral-authd = "behavioral_auth.daemon.main:main"
behavioral-auth  = "behavioral_auth.cli.main:main"
behavioral-face  = "behavioral_auth.cli.face_cmd:main"
behavioral-report = "behavioral_auth.cli.report_cmd:main"
